services:
  app:
    image: ghcr.io/vicentyaming-pixel/infinite-canvas:rainyun
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-rainyun}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      STORAGE_API_TOKEN: ${STORAGE_API_TOKEN:-}
      # 统计分析（可选，默认关闭）。
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
